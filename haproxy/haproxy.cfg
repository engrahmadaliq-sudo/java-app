global
    log /dev/log local0
    log /dev/log local1 notice
    maxconn 4096
    daemon

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    retries 3

# ---------- Frontend ----------
frontend java_app_front
    bind *:80
    # bind *:443 ssl crt /etc/haproxy/certs/app.pem   # enable once you have TLS cert
    default_backend java_app_back

# ---------- Backend: Kubernetes worker nodes via NodePort ----------
backend java_app_back
    balance roundrobin
    option httpchk GET /actuator/health
    http-check expect status 200
    server k8s-node1 10.0.0.1:30080 check inter 5s fall 3 rise 2
    server k8s-node2 10.0.0.2:30080 check inter 5s fall 3 rise 2
    server k8s-node3 10.0.0.3:30080 check inter 5s fall 3 rise 2

# ---------- Stats page (also scraped by haproxy_exporter for Prometheus) ----------
listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s
    stats auth admin:changeme123
