# Sample Nagios host/service checks for infrastructure monitoring
# Place under /usr/local/nagios/etc/objects/ on the Nagios server
# Requires NRPE agent installed on each target host

define host {
    use                     linux-server
    host_name               k8s-node1
    alias                   Kubernetes Node 1
    address                 10.0.0.1
}

define host {
    use                     linux-server
    host_name               haproxy-server
    alias                   HAProxy Load Balancer
    address                 10.0.0.100
}

define service {
    use                     generic-service
    host_name               k8s-node1
    service_description     CPU Load
    check_command           check_nrpe!check_load
}

define service {
    use                     generic-service
    host_name               k8s-node1
    service_description     Disk Space
    check_command           check_nrpe!check_disk
}

define service {
    use                     generic-service
    host_name               haproxy-server
    service_description     HAProxy Process
    check_command           check_nrpe!check_haproxy_proc
}

define service {
    use                     generic-service
    host_name               haproxy-server
    service_description     HTTP Port 80
    check_command           check_http!-p 80
}
