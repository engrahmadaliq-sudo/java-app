groups:
  - name: java-app-alerts
    rules:
      - alert: HighJVMMemoryUsage
        expr: (jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"}) > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High JVM heap usage on {{ $labels.instance }}"
          description: "JVM heap usage is above 85% for more than 5 minutes."

      - alert: PodCrashLooping
        expr: increase(kube_pod_container_status_restarts_total{pod=~"java-app.*"}[15m]) > 3
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Pod {{ $labels.pod }} is crash looping"
          description: "Pod has restarted more than 3 times in the last 15 minutes."

      - alert: HighErrorRate
        expr: rate(http_server_requests_seconds_count{status=~"5.."}[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High 5xx error rate on java-app"
          description: "More than 5% of requests are failing with 5xx errors."

      - alert: HAProxyBackendDown
        expr: haproxy_server_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "HAProxy backend {{ $labels.server }} is down"
          description: "HAProxy health check has marked this backend server as down."
